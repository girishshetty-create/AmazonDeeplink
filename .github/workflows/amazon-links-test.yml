name: Amazon Links Test

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}        # lets you click "Run workflow" manually in GitHub
  schedule:
    - cron: '0 7 * * 1,3'      # Mon & Wed at 07:00 UTC = 12:30pm IST

permissions:
  contents: read
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run tests
        run: npx playwright test tests/amazoninks.spec.ts

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Report failure as GitHub issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'scheduled-test-failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `Scheduled Amazon Deeplink test failed.\n\nRun: ${runUrl}\nTriggered by: ${context.eventName}\nTime: ${new Date().toISOString()}`;

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });

            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Scheduled Amazon Deeplink test is failing',
                body,
                labels: [label],
              });
            }