name: Amazon Links Test

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}        # lets you click "Run workflow" manually in GitHub
  schedule:
    - cron: '0 6 * * *'        # runs daily at 6:00 AM UTC — adjust or remove if not needed

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run tests
        run: npx playwright test tests/amazoninks.spec.ts

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14